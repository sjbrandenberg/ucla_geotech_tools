[tool.poetry]
version = "3.0.3"

packages = [
    {include = "ucla_geotech_tools", from = "src"},
]
requires-poetry = '>=2.0'

[tool.poetry.group.test.dependencies]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"

[build-system]
requires = ['poetry-core (>=2.0)',"cython","numpy"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.build]
generate-setup-file = false


[project]
name = "ucla_geotech_tools"
description = "A collection of software tools developed by the UCLA geotechnical group"
license = "LICENSE.txt"
dynamic = ["version"]
readme = "README.md"
authors = [{name = "Scott J. Brandenberg"}]
requires-python = '>=3.9,<4.0'
dependencies = ['numpy (>=2,<3)', 'scipy (>=1.8,<2.0)']
